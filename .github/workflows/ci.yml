name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout with the upstream submodule
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore, build and test
        shell: pwsh
        run: '& "${{ github.workspace }}/scripts/Build.ps1" -Configuration Release'

      # Catches single-file publish regressions (native SQLite, WebView assets) before a release does.
      - name: Publish smoke (self-contained single-file win-x64)
        shell: pwsh
        run: >-
          dotnet publish "${{ github.workspace }}/src/ScarletMeter.App/ScarletMeter.App.csproj"
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          --output "${{ github.workspace }}/publish"
