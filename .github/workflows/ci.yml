name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      # Actions are pinned to the commit of a release (named in the comment), so a moved tag cannot change what runs;
      # nothing here pushes, so the token is not kept in git's config.
      - name: Checkout with the upstream submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # checkout runs `git submodule update --init --force --depth=1`: the submodule gets the pinned commit and only
      # the tags that follow upstream's default-branch tip, not the pinned release's, so the build stamp
      # (src/ScarletMeter.App/Updates/BuildStamp.targets) would fall back to the commit. Fetch just the release
      # tag that names the pinned commit. Finding none fails the run: the pin must be a release (AGENTS.md,
      # "Upstream boundary"). BuildInfoTests then checks that the build stamped this tag. The --depth=1 fetch suits this
      # already shallow clone only: on a full clone it would make the submodule shallow.
      - name: Fetch the pinned upstream release tag
        shell: pwsh
        run: |
          # Runs git up to three times, waiting 10 s and then 20 s between attempts (never after the last one).
          function Invoke-GitWithRetry([string[]]$Arguments) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              $output = @(git @Arguments)
              if ($LASTEXITCODE -eq 0) { return ,$output }
              if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
            }
            throw "git $($Arguments -join ' ') failed three times."
          }
          $upstream = Join-Path '${{ github.workspace }}' 'upstream'
          $pinned = (git -C $upstream rev-parse HEAD).Trim()
          $listing = Invoke-GitWithRetry @('-C', $upstream, 'ls-remote', '--tags', 'origin', 'refs/tags/v*')
          $tags = @($listing | ForEach-Object {
            if ($_ -match "^$pinned\trefs/tags/(v[0-9]+(\.[0-9]+){3})(\^\{\})?$") { $Matches[1] }
          } | Select-Object -Unique | Sort-Object { [version]$_.Substring(1) } -Descending)
          if (-not $tags) { throw "Upstream commit $pinned is not a release tag. Move the pin with scripts/Update-Upstream.ps1." }
          $tag = $tags[0]
          Invoke-GitWithRetry @('-C', $upstream, 'fetch', '--quiet', '--no-tags', '--depth=1', 'origin', "+refs/tags/${tag}:refs/tags/${tag}") | Out-Null
          "SCARLET_EXPECTED_UPSTREAM_RELEASE=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Pinned upstream release: $tag ($pinned)"

      # The app's version (src/Directory.Build.props) has its CHANGELOG.md section, read by the script the release
      # workflow uses, so a version bump without one fails here rather than at the tag.
      - name: The changelog has the app version's section
        shell: pwsh
        run: |
          [xml]$props = Get-Content -LiteralPath "${{ github.workspace }}/src/Directory.Build.props" -Raw
          $version = @($props.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          $section = & "${{ github.workspace }}/scripts/Get-ChangelogSection.ps1" -Version $version
          Write-Host "CHANGELOG.md has $version, $(@($section -split "`n" | Where-Object { $_ -like '- *' }).Count) changes."

      # The script's refusals and section bounds on throwaway changelogs (a missing section, a missing or impossible
      # date, an empty section, a reference link inside one).
      - name: Changelog script cases
        shell: pwsh
        run: '& "${{ github.workspace }}/scripts/Test-ChangelogSection.ps1"'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore, build and test
        shell: pwsh
        run: '& "${{ github.workspace }}/scripts/Build.ps1" -Configuration Release'

      # The release's complete-source zip (scripts/Write-SourceArchive.ps1) for this commit, into the runner's temp
      # directory: the checkout's files and RATmeter's under upstream/, nothing outside its top folder.
      - name: Source archive
        shell: pwsh
        run: |
          $zip = Join-Path '${{ runner.temp }}' 'ScarletMeter-0.0.0-source.zip'
          & (Join-Path '${{ github.workspace }}' 'scripts/Write-SourceArchive.ps1') -Version 0.0.0 -OutputPath $zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try { $entries = @($archive.Entries | ForEach-Object { $_.FullName }) } finally { $archive.Dispose() }
          foreach ($required in 'LICENSE', 'NOTICE', 'ScarletMeter.slnx', 'src/ScarletMeter.App/ScarletMeter.App.csproj', 'upstream/LICENSE', 'upstream/AionDpsMeter.slnx') {
            if ($entries -notcontains "ScarletMeter-0.0.0-source/$required") { throw "The source archive lacks $required." }
          }
          if ($entries | Where-Object { $_ -notlike 'ScarletMeter-0.0.0-source/*' }) { throw 'The source archive holds an entry outside its top folder.' }
          Write-Host "Source archive checked: $($entries.Count) entries"

      # Install-Meter.ps1's refusals (someone's folder, links, overlaps with the data directory or the checkout in
      # any spelling) against throwaway folders, with -CheckOnly: nothing is built or moved.
      - name: Installer refusals
        shell: pwsh
        run: '& "${{ github.workspace }}/scripts/Test-InstallMeter.ps1"'

      # The player's install path under pwsh, twice, into the runner's temp directory: a Release build (the tests ran
      # above), the self-contained single-file win-x64 publish into a staging folder, Test-PublishLayout.ps1 on that
      # published output, the install marker, then the folder swap. The second install must accept the first by its
      # marker and keep it as .previous. Nothing here launches the meter.
      - name: Install smoke (publish, layout check, folder swap, twice)
        shell: pwsh
        run: |
          $installer = Join-Path '${{ github.workspace }}' 'scripts/Install-Meter.ps1'
          $install = Join-Path '${{ runner.temp }}' 'ScarletMeter'
          & $installer -InstallDirectory $install -SkipTests
          & $installer -InstallDirectory $install -SkipTests
          foreach ($folder in $install, "$install.previous") {
            if (-not (Test-Path -LiteralPath (Join-Path $folder 'ScarletMeter.exe') -PathType Leaf)) { throw "$folder holds no ScarletMeter.exe." }
            if (-not (Test-Path -LiteralPath (Join-Path $folder '.scarlet-install') -PathType Leaf)) { throw "$folder has no install marker." }
            if (Test-Path -LiteralPath (Join-Path $folder 'ScarletMeter.portable')) { throw "$folder carries the portable marker, so it would keep its data beside the exe." }
          }
          foreach ($folder in "$install.staging", "$install.retired") {
            if (Test-Path -LiteralPath $folder) { throw "$folder was left behind." }
          }

      # The live portable copy's folder rules (scripts/PortableFolders.ps1) against throwaway folders: the first copy,
      # an update that keeps the data folder, refusals, cut-short updates, earlier builds, the zip, a running meter.
      # Nothing is built and the meter is not launched (a hidden, renamed ping.exe stands in for it).
      - name: Portable folder rules
        shell: pwsh
        run: '& "${{ github.workspace }}/scripts/Test-PortableFolders.ps1"'

      # The portable build under pwsh, twice, into the runner's temp directory. The first run (-Zip) publishes into
      # staging, checks the layout, adds the marker, writes the zip and makes the live copy: the zip must hold the exe
      # and the marker under a top "ScarletMeter" folder and no data or staging marker. A settings file is then planted
      # in the copy's data folder and a file of the player's beside it; the second run (no -Zip) must update the copy in
      # place with both intact, leave no .staging or .old, remove the older zip, and leave exactly one ScarletMeter.exe.
      # Nothing launches the meter.
      - name: Portable build (publish, layout check, marker, zip, in-place update, twice)
        shell: pwsh
        run: |
          $publish = Join-Path '${{ github.workspace }}' 'scripts/Publish-Portable.ps1'
          $root = Join-Path '${{ runner.temp }}' 'portable'
          $live = Join-Path $root 'ScarletMeter'
          $zip = Join-Path $root 'ScarletMeter-win-x64.zip'
          & $publish -OutputRoot $root -SkipTests -Zip
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "No zip at $zip." }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try { $entries = @($archive.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }) } finally { $archive.Dispose() }
          foreach ($required in 'ScarletMeter/ScarletMeter.exe', 'ScarletMeter/ScarletMeter.portable', 'ScarletMeter/.scarlet-portable-files', 'ScarletMeter/wwwroot/index.html') {
            if ($entries -notcontains $required) { throw "The zip lacks $required." }
          }
          if ($entries | Where-Object { $_ -notlike 'ScarletMeter/*' -or $_ -like 'ScarletMeter/data/*' -or $_ -like '*/.scarlet-portable-staging' }) { throw 'The zip holds an entry outside ScarletMeter/, a data folder or the staging marker.' }
          Write-Host "Portable zip checked: $([math]::Round((Get-Item -LiteralPath $zip).Length / 1MB)) MB, $($entries.Count) entries"
          foreach ($required in 'ScarletMeter.exe', 'ScarletMeter.portable', 'wwwroot/index.html') {
            if (-not (Test-Path -LiteralPath (Join-Path $live $required) -PathType Leaf)) { throw "The live copy $live lacks $required." }
          }
          if (Test-Path -LiteralPath (Join-Path $live '.scarlet-portable-staging')) { throw 'The live copy kept the staging marker.' }
          $settings = Join-Path $live 'data/settings.json'
          [void][IO.Directory]::CreateDirectory((Split-Path -Parent $settings))
          [IO.File]::WriteAllText($settings, '{ "ci": "kept" }')
          $notes = Join-Path $live 'notes.txt'
          [IO.File]::WriteAllText($notes, 'the player''s own file')
          & $publish -OutputRoot $root -SkipTests
          if ([IO.File]::ReadAllText($settings) -ne '{ "ci": "kept" }') { throw 'The in-place update lost the data folder.' }
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw 'The in-place update lost a file the player put beside the exe.' }
          foreach ($leftover in "$live.staging", "$live.old", $zip, "$zip.partial") {
            if (Test-Path -LiteralPath $leftover) { throw "$leftover was left behind." }
          }
          $exes = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter 'ScarletMeter.exe')
          if ($exes.Count -ne 1) { throw "Expected one ScarletMeter.exe under $root, found $($exes.Count)." }
          Write-Host "Portable copy updated in place with its data kept: $($exes[0].FullName)"
