name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout with the upstream submodule
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore, build and test
        shell: pwsh
        run: '& "${{ github.workspace }}/scripts/Build.ps1" -Configuration Release'

      # Proves the self-contained single-file publish completes (win-x64 restore, static web assets, bundling).
      # The next step checks its layout; nothing here launches the meter.
      - name: Publish smoke (self-contained single-file win-x64)
        shell: pwsh
        run: >-
          dotnet publish "${{ github.workspace }}/src/ScarletMeter.App/ScarletMeter.App.csproj"
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          --output "${{ github.workspace }}/publish"

      - name: Verify published layout
        shell: pwsh
        run: '& "${{ github.workspace }}/scripts/Test-PublishLayout.ps1" -PublishDirectory "${{ github.workspace }}/publish"'
