name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout with the upstream submodule
        uses: actions/checkout@v7
        with:
          submodules: true

      # checkout runs `git submodule update --init --force --depth=1`: the submodule gets the pinned commit and only
      # the tags that follow upstream's default-branch tip, not the pinned release's, so the build stamp
      # (src/ScarletMeter.App/Updates/BuildStamp.targets) would fall back to the commit. Fetch just the release
      # tag that names the pinned commit. Finding none fails the run: the pin must be a release (AGENTS.md,
      # "Upstream boundary"). BuildInfoTests then checks that the build stamped this tag.
      - name: Fetch the pinned upstream release tag
        shell: pwsh
        run: |
          $upstream = Join-Path '${{ github.workspace }}' 'upstream'
          $pinned = (git -C $upstream rev-parse HEAD).Trim()
          $listing = $null
          foreach ($attempt in 1..3) {
            $listing = @(git -C $upstream ls-remote --tags origin 'refs/tags/v*')
            if ($LASTEXITCODE -eq 0) { break }
            $listing = $null
            Start-Sleep -Seconds (10 * $attempt)
          }
          if ($null -eq $listing) { throw 'Listing upstream tags failed three times.' }
          $tags = @($listing | ForEach-Object {
            if ($_ -match "^$pinned\trefs/tags/(v[0-9]+(\.[0-9]+){3})(\^\{\})?$") { $Matches[1] }
          } | Select-Object -Unique | Sort-Object { [version]$_.Substring(1) } -Descending)
          if (-not $tags) { throw "Upstream commit $pinned is not a release tag. Move the pin with scripts/Update-Upstream.ps1." }
          $tag = $tags[0]
          git -C $upstream fetch --quiet --no-tags --depth=1 origin "+refs/tags/${tag}:refs/tags/${tag}"
          if ($LASTEXITCODE) { throw "Fetching $tag failed." }
          "SCARLET_EXPECTED_UPSTREAM_RELEASE=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Pinned upstream release: $tag ($pinned)"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore, build and test
        shell: pwsh
        run: '& "${{ github.workspace }}/scripts/Build.ps1" -Configuration Release'

      # The player's install path under pwsh, into the runner's temp directory: a Release build (the tests ran
      # above), the self-contained single-file win-x64 publish into a staging folder, Test-PublishLayout.ps1 on it,
      # then the folder swap. Nothing here launches the meter.
      - name: Install smoke (publish, layout check, folder swap)
        shell: pwsh
        run: '& "${{ github.workspace }}/scripts/Install-Meter.ps1" -InstallDirectory "${{ runner.temp }}\ScarletMeter" -SkipTests'
