<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scarlet Meter</title>
    <base href="/" />
    <!-- Scripts only from the app; images only from the app, the two local virtual hosts and NC's game-data CDN
         (skill icons). Inline styles are allowed because the pages set widths and colours in style attributes. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://data.scarlet.example https://assets.scarlet.example https://assets.playnccdn.com; connect-src 'self'; object-src 'none'; base-uri 'self'" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/views.css" />
    <link rel="stylesheet" href="css/alerts.css" />
</head>
<body>
    <div id="app"></div>
    <script src="_framework/blazor.webview.js"></script>
    <!-- Rows that glide when one player overtakes another (the overlay's "Bar effects"). -->
    <script src="js/overlay-fx.js"></script>
    <!-- The overlay's heights, so its window fits the player's height to its content (the rows scroll, never the notices). -->
    <script src="js/overlay-size.js"></script>
</body>
</html>
